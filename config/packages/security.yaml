security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    role_hierarchy:
        ROLE_PDG: [ROLE_BU, ROLE_USER]
        ROLE_BU: [ROLE_USER]

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            logout:
                path: app_logout
                target: app_login
            two_factor:
                auth_form_path: app_2fa_login
                check_path: app_2fa_login_check

    access_control:
        # PDG : accès total à /admin
        - { path: ^/admin, roles: ROLE_PDG }

        # BU : accès aux routes de gestion des projets et alertes BU
        - { path: ^/project/attribution, roles: ROLE_BU }
        - { path: ^/project/edit, roles: ROLE_BU }
        - { path: ^/bu, roles: ROLE_BU }

        # Collaborateur : accès à ses projets, fichiers, notifications et compte
        - { path: ^/project/mes-projets, roles: ROLE_USER }
        - { path: ^/project/fichier, roles: ROLE_USER }
        - { path: ^/notification, roles: ROLE_USER }
        - { path: ^/account, roles: ROLE_USER }

        # Tous les utilisateurs connectés peuvent voir le dashboard
        - { path: ^/dashboard, roles: ROLE_USER }

        # Accès 2FA uniquement pour les utilisateurs en cours de 2FA
        - { path: ^/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }

        # Déconnexion publique
        - { path: ^/logout, roles: PUBLIC_ACCESS }
