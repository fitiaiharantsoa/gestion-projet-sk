parameters:
    project_files_directory: '%kernel.project_dir%/public/uploads/project_files'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # Chargement automatique de tout le src
    App\:
        resource: '../src/'
        exclude: '../src/{DependencyInjection,Entity,Migrations,Tests,Kernel.php}'

    # EventListener pour trusted device
    App\EventListener\TrustedDeviceListener:
        tags:
            - { name: kernel.event_listener, event: security.interactive_login, method: onInteractiveLogin }

    App\EventListener\TrustedDeviceBypassListener:
        tags:
            - { name: kernel.event_listener, event: scheb_two_factor.require, method: onRequire2FA }

    # Condition personnalisée trusted device
    trusted_device:
        class: App\Security\Condition\TrustedDeviceCondition
        tags:
            - { name: 'scheb_two_factor.condition', key: 'trusted_device' }

    # EventSubscriber pour notifications
    App\EventSubscriber\NotificationSubscriber:
        tags:
            - { name: kernel.event_subscriber }
